services:
  db:
    image: mariadb:11
    environment: { MARIADB_ROOT_PASSWORD: root, MARIADB_DATABASE: prestashop, MARIADB_USER: ps, MARIADB_PASSWORD: ps }
  ps:
    image: prestashop/prestashop:9.0
    depends_on: [db]
    ports: ["8089:80"]
    environment:
      DB_SERVER: db
      DB_USER: ps
      DB_PASSWD: ps
      DB_NAME: prestashop
      PS_INSTALL_AUTO: "1"
      PS_DOMAIN: localhost:8089
      PS_LANGUAGE: fr
      PS_COUNTRY: FR
      PS_FOLDER_INSTALL: install-done
      ADMIN_MAIL: demo@virevo.test
      ADMIN_PASSWD: demo-local-2026
      PS_ENABLE_SSL: "0"
    extra_hosts: ["host.docker.internal:host-gateway"]
    volumes: [ "psdata:/var/www/html" ]
volumes: { psdata: {} }
