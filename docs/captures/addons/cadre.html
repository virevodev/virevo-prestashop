<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Capture Addons</title>
<style>
  html, body { margin: 0; }
  body { width: 1600px; height: 1200px; background: linear-gradient(160deg, #0c2230 0%, #0b5d57 100%); font-family: "Segoe UI", Arial, sans-serif; display: flex; flex-direction: column; align-items: center; }
  h1 { color: #fff; font-size: 52px; font-weight: 700; margin: 64px 0 44px; letter-spacing: -0.5px; }
  .ecran { width: 1365px; height: 960px; border-radius: 14px; overflow: hidden; box-shadow: 0 24px 60px rgba(0, 0, 0, 0.35); background: #fff; }
  .ecran img { width: 100%; height: 100%; object-fit: cover; object-position: top; display: block; }
</style>
</head>
<body>
<h1 id="titre"></h1>
<div class="ecran"><img id="img" alt=""></div>
<script>
  // Une capture par valeur de ?n=, recadrée en haut si elle est plus haute que 1280×900.
  const captures = {
    1: ["1-paiement.png", "Customers pay by instant bank transfer at checkout"],
    2: ["2-commande-payee.png", "The order moves to “Payment accepted” on its own"],
    3: ["3-reglages.png", "Three fields to set up, with a test mode"],
    4: ["4-service-indisponible.png", "Service unavailable? The customer keeps their cart"],
  };
  const [fichier, titre] = captures[new URLSearchParams(location.search).get("n")];
  document.getElementById("titre").textContent = titre;
  document.getElementById("img").src = "../" + fichier;
</script>
</body>
</html>
